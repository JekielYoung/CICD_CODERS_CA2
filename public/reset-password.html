<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · Orbit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-main">
    <div class="auth-card">
      <a class="d-inline-flex align-items-center gap-2 fw-bold fs-4 text-dark text-decoration-none mb-4" href="index.html">
        <img src="images/orbit-logo.svg" alt="" width="30" height="30">
        Orbit
      </a>

      <h1 class="h3 fw-bold mb-1">Choose a new password</h1>
      <p class="text-secondary mb-4">At least 8 characters, with a number.</p>

      <div class="alert alert-danger py-2" id="form-alert" role="alert" hidden></div>
      <div class="alert alert-success" id="success-alert" role="status" hidden></div>

      <form id="reset-form" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="password">New password</label>
          <div class="input-group has-validation">
            <input id="password" name="password" type="password" class="form-control form-control-lg"
                   autocomplete="new-password" required>
            <button class="btn btn-outline-secondary password-toggle" type="button" id="toggle-password"
                    aria-label="Show password">Show</button>
            <div class="invalid-feedback"></div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold" for="confirm">Confirm new password</label>
          <input id="confirm" name="confirm" type="password" class="form-control form-control-lg"
                 autocomplete="new-password" required>
          <div class="invalid-feedback"></div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-dark btn-lg" id="submit-btn">Update password</button>
        </div>
      </form>

      <p class="text-center mt-4 mb-0">
        <a class="link-dark fw-semibold" href="login.html" id="back-link">← Back to log in</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
