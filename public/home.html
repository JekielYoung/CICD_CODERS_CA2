<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My trips · Orbit</title>
  <!-- Bootstrap first, then our overrides -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/home.css">
  <!-- Redirects to login.html if there is no token -->
  <script type="module" src="js/shared/auth-check.js"></script>
</head>
<body>

  <!-- Top bar -->
  <nav class="navbar navbar-expand-md bg-white border-bottom orbit-navbar">
    <div class="container-xl">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="home.html">
        <img src="images/orbit-logo.svg" alt="" width="28" height="28">
        Orbit
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topbar-menu"
              aria-controls="topbar-menu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="topbar-menu">
        <ul class="navbar-nav me-auto ms-md-3">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="home.html">My trips</a></li>
          <li class="nav-item"><a class="nav-link" href="home.html?view=shared">Shared with me</a></li>
        </ul>

        <form class="d-flex me-md-3 my-2 my-md-0" role="search">
          <label for="search" class="visually-hidden">Search trips</label>
          <input id="search" class="form-control" type="search" placeholder="Search trips">
        </form>

        <div class="dropdown">
          <button class="btn btn-outline-dark rounded-pill d-flex align-items-center gap-2 py-1 ps-1"
                  type="button" id="user-menu-btn" data-bs-toggle="dropdown" aria-expanded="false">
            <span class="avatar" id="user-initials">JD</span>
            <span id="user-name">John</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><button class="dropdown-item" type="button" id="logout-btn">Log out</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-xl py-4 py-md-5">

    <!-- Greeting + quick create -->
    <section class="row align-items-end g-4 mb-4">
      <div class="col-lg-5">
        <h1 class="h2 mb-1" id="greeting">Welcome</h1>
        <p class="text-secondary mb-0" id="greeting-sub"></p>
      </div>

      <div class="col-lg-7">
        <!-- This form does not create anything. A trip needs a name (trip.title is NOT NULL),
             so it hands off to trip-form.html as a plain GET. trip-form.js reads
             ?destination=&start_date=&end_date= and prefills the fields. -->
        <form class="card card-body" id="quick-trip-form" action="trip-form.html" method="get">
          <h2 class="h6 mb-3">Start a new trip</h2>
          <div class="row g-2 align-items-end">
            <div class="col-sm-4">
              <label class="form-label small fw-semibold" for="qt-destination">Where to?</label>
              <input id="qt-destination" name="destination" type="text" class="form-control" maxlength="100" placeholder="e.g. Kyoto, Japan" required>
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label small fw-semibold" for="qt-start">Start</label>
              <input id="qt-start" name="start_date" type="date" class="form-control">
            </div>
            <div class="col-6 col-sm-3">
              <label class="form-label small fw-semibold" for="qt-end">End</label>
              <input id="qt-end" name="end_date" type="date" class="form-control">
            </div>
            <div class="col-sm-2 d-grid">
              <button type="submit" class="btn btn-dark">Continue</button>
            </div>
          </div>
          <p class="form-text mb-0 mt-2">You can name the trip and invite travellers on the next step.</p>
        </form>
      </div>
    </section>

    <!-- Filter + sort.
         When switching filters, home.js toggles btn-dark / btn-outline-dark on the buttons. -->
    <section class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div class="btn-group" role="group" aria-label="Trip filter">
        <button type="button" class="btn btn-dark" data-filter="upcoming">Upcoming · <span id="count-upcoming">0</span></button>
        <button type="button" class="btn btn-outline-dark" data-filter="past">Past · <span id="count-past">0</span></button>
        <button type="button" class="btn btn-outline-dark" data-filter="all">All</button>
      </div>

      <label class="visually-hidden" for="sort">Sort trips</label>
      <select id="sort" class="form-select w-auto">
        <option value="start">Sort: Start date</option>
        <option value="name">Sort: Name</option>
      </select>
    </section>

    <!-- Trip cards: home.js fills #trip-grid from /api/trips.
         Only the "New trip" card is static; home.js keeps it and adds the trip cards after it. -->
    <section class="row row-cols-1 row-cols-md-2 row-cols-xl-4 g-3" id="trip-grid" aria-live="polite">

      <div class="col" id="trip-new-col">
        <a class="card h-100 trip-new text-decoration-none text-secondary" href="trip-form.html">
          <div class="card-body d-flex flex-column align-items-center justify-content-center text-center gap-1 py-5">
            <span class="trip-new__plus">+</span>
            <strong class="text-dark">New trip</strong>
            <span class="small">Name, destination and dates</span>
          </div>
        </a>
      </div>
    </section>

    <!-- Shown by home.js when the filter or search finds nothing -->
    <p class="text-center text-secondary mt-5" id="empty-state" hidden>No trips found.</p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/home.js"></script>

  <script type="module">
    import { logout } from './js/shared/api.js';
    document.getElementById('logout-btn').addEventListener('click', logout);
  </script>
  
</body>
</html>
