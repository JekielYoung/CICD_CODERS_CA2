<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · Orbit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-main">
    <div class="auth-card">
      <a class="d-inline-flex align-items-center gap-2 fw-bold fs-4 text-dark text-decoration-none mb-4" href="index.html">
        <img src="images/orbit-logo.svg" alt="" width="30" height="30">
        Orbit
      </a>

      <h1 class="h3 fw-bold mb-1">Forgot your password?</h1>
      <p class="text-secondary mb-4">Enter your email and we'll send you a link to choose a new one.</p>

      <div class="alert alert-danger py-2" id="form-alert" role="alert" hidden></div>
      <div class="alert alert-success" id="success-alert" role="status" hidden></div>

      <form id="forgot-form" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">Email</label>
          <input id="email" name="email" type="email" class="form-control form-control-lg"
                 placeholder="you@example.com" autocomplete="email" maxlength="254" required>
          <div class="invalid-feedback"></div>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-dark btn-lg" id="submit-btn">Send reset link</button>
        </div>
      </form>

      <p class="text-center mt-4 mb-0">
        <a class="link-dark fw-semibold" href="login.html">← Back to log in</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
